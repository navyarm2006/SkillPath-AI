
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Zone | SkillPath AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .quiz-option {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            cursor: pointer;
            text-align: left;
        }
        .quiz-option:disabled {
            cursor: default;
            opacity: 0.85;
        }
        #feedback {
            margin: 16px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="container">
        <button class="back-button"
            onclick="window.location.href='index.html'">
            ← Back to Dashboard
        </button>

        <section class="result">
            <h1>🧠 SkillPath AI — Practice Zone</h1>
            <p>Answer the questions and improve your Python skills.</p>

            <h3 id="questionNumber">Question 1 of 5</h3>
            <h2 id="question">Loading question...</h2>

            <div id="options"></div>
            <p id="feedback" aria-live="polite"></p>

            <button id="nextButton" type="button" hidden>
                Next Question →
            </button>

            <p id="score">Score: 0</p>
        </section>
    </main>

    <script>
        const questions = [
            {
                question: "What is the output of print(2 + 3)?",
                options: ["4", "5", "6", "23"],
                answer: "5"
            },
            {
                question: "Which symbol starts a single-line comment in Python?",
                options: ["//", "#", "/*", "&"],
                answer: "#"
            },
            {
                question: "What is the result of 10 % 3 in Python?",
                options: ["3", "1", "0", "10"],
                answer: "1"
            },
            {
                question: "Which data type represents True or False?",
                options: ["int", "str", "bool", "list"],
                answer: "bool"
            },
            {
                question: "Which keyword repeats a loop while a condition is true?",
                options: ["repeat", "while", "define", "return"],
                answer: "while"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionNumber = document.getElementById("questionNumber");
        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const feedback = document.getElementById("feedback");
        const nextButton = document.getElementById("nextButton");
        const scoreElement = document.getElementById("score");

        function showQuestion() {
            answered = false;

            const q = questions[currentQuestion];
            questionNumber.textContent =
                `Question ${currentQuestion + 1} of ${questions.length}`;
            questionElement.textContent = q.question;
            feedback.textContent = "";
            nextButton.hidden = true;
            optionsElement.replaceChildren();

            q.options.forEach(option => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "quiz-option";
                button.textContent = option;

                button.addEventListener("click", () => checkAnswer(option));
                optionsElement.appendChild(button);
            });
        }

        function checkAnswer(selected) {
            if (answered) return;
            answered = true;

            const correct = questions[currentQuestion].answer;

            if (selected === correct) {
                score++;
                feedback.textContent = "✅ Correct! Well done!";
            } else {
                feedback.textContent =
                    `❌ Not quite. The correct answer is ${correct}.`;
            }

            scoreElement.textContent = `Score: ${score}`;

            Array.from(optionsElement.children).forEach(button => {
                button.disabled = true;

                if (button.textContent === correct) {
                    button.style.border = "2px solid green";
                }
            });

            nextButton.hidden = false;
            nextButton.textContent =
                currentQuestion === questions.length - 1
                    ? "See Final Score"
                    : "Next Question →";
        }

        nextButton.addEventListener("click", function () {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion();
            } else {
                questionNumber.textContent = "Practice Complete!";
                questionElement.textContent =
                    `You scored ${score} out of ${questions.length}.`;
                optionsElement.replaceChildren();
                feedback.textContent =
                    score === questions.length
                        ? "🏆 Excellent! You answered every question correctly!"
                        : "Keep practising! You can try the quiz again by refreshing the page.";
                nextButton.hidden = true;
            }
        });

        showQuestion();
    </script>
</body>
</html>
